<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Prime Kutz Barbershop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>

    <header>
        <nav class="navbar">
            <ul class="nav-group">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
            </ul>
            <div class="logo">
                <img src="logo.png" alt="Prime Kutz Logo">
            </div>
            <ul class="nav-group">
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="gallery-hero">
    <div class="centered-player-container">
        <div id="video-cover-overlay" class="cover-image-wrapper" onclick="startVideo()">
            <img src="gabyhaircutting.jpg" alt="Prime Kutz Gallery" class="cover-photo">
            <button class="big-centered-play">▶</button>
        </div>
        <div id="main-video-container" style="display:none">
            <video id="primeKutzVideo" width="100%" playsinline onclick="togglePlayPause()">
                <source src="galleryvideo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
</section>

    <section class="services-page">
        <h1 class="section-title">Services & Pricing</h1>
        <div class="pricing-container">
            <div class="pricing-item">
                <span class="service-name">Men's Haircut</span>
                <span class="price">$30</span>
            </div>
            <div class="pricing-item">
                <span class="service-name">Beard Trim & Lineup</span>
                <span class="price">$20</span>
            </div>
            <div class="pricing-item">
                <span class="service-name">Full Service (Cut & Beard)</span>
                <span class="price">$45</span>
            </div>
            <div class="pricing-item">
                <span class="service-name">Kids Haircut</span>
                <span class="price">$25</span>
            </div>
        </div>
    </section>
<script>
    const video = document.getElementById('primeKutzVideo');
    const cover = document.getElementById('video-cover-overlay');
    const container = document.getElementById('main-video-container');
    function startVideo() {
        cover.style.display = 'none';
        container.style.display = 'block';
        video.muted = false;
        video.play();
    }
    function togglePlayPause() {
        video.muted = false;
        
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    }
</script>
</body>
</html>
